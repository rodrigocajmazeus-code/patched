<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111211" />
  <meta name="description" content="ONDA: tu música, tus favoritos, sin ruido." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ONDA" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/onda.svg" />
  <link rel="apple-touch-icon" href="./icons/onda-192.png" />
  <link rel="preconnect" href="https://api.audius.co" />
  <link rel="stylesheet" href="./styles.css" />
  <title>ONDA — Música a tu ritmo</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span><span>onda<span class="brand-dot">.</span></span></div>
      <nav class="side-nav" aria-label="Secciones">
        <button class="nav-link selected" data-view="home"><span class="ico" data-icon="home"></span> Inicio</button>
        <button class="nav-link" data-view="search"><span class="ico" data-icon="search"></span> Buscar</button>
        <button class="nav-link" data-view="library"><span class="ico" data-icon="heart"></span> Mi música</button>
      </nav>
      <div class="sidebar-bottom"><div class="sidebar-divider"></div><button class="nav-link" data-action="settings"><span class="ico" data-icon="settings"></span> Configuración</button><div class="sidebar-foot">Música sin complicaciones.<br><span>Audius · Jamendo · enlaces oficiales</span></div></div>
    </aside>

    <div class="page-column">
      <header class="topbar">
        <div class="top-logo"><span class="brand-mark small" aria-hidden="true"><span></span><span></span><span></span></span>onda<span class="brand-dot">.</span></div>
        <label class="searchbar"><span class="ico" data-icon="search"></span><input id="search-input" type="search" placeholder="Mrs Magic, Bad Bunny, artista…" autocomplete="off" enterkeyhint="search" aria-label="Buscar música" /><kbd>↵</kbd></label>
        <div class="header-actions"><button class="icon-btn install-btn" data-action="install" title="Instalar aplicación" aria-label="Instalar aplicación"><span class="ico" data-icon="download"></span></button><button class="avatar-btn" data-action="settings" title="Configuración" aria-label="Configuración">O</button></div>
      </header>
      <main id="content" tabindex="-1" aria-live="polite"><div class="initial-loading"><span class="spinner"></span>Cargando música…</div></main>
    </div>
  </div>

  <div class="player" id="player" aria-label="Reproductor">
    <div class="player-track" id="player-track"><div class="cover cover-mini placeholder" id="player-cover"><span class="ico" data-icon="music"></span></div><div class="player-meta"><strong id="player-title">Elige algo para escuchar</strong><span id="player-artist">ONDA</span></div><button class="icon-btn like-control" id="player-like" data-action="like-current" aria-label="Agregar a favoritos"><span class="ico" data-icon="heart"></span></button></div>
    <div class="player-middle"><div class="transport"><button class="icon-btn extra-control" id="shuffle-btn" data-action="shuffle" title="Aleatorio" aria-label="Modo aleatorio"><span class="ico" data-icon="shuffle"></span></button><button class="icon-btn" data-action="previous" title="Anterior" aria-label="Pista anterior"><span class="ico" data-icon="prev"></span></button><button class="play-main" id="play-btn" data-action="play" title="Reproducir" aria-label="Reproducir"><span class="ico" data-icon="play"></span></button><button class="icon-btn" data-action="next" title="Siguiente" aria-label="Pista siguiente"><span class="ico" data-icon="next"></span></button><button class="icon-btn extra-control" id="repeat-btn" data-action="repeat" title="Repetir" aria-label="Modo repetir"><span class="ico" data-icon="repeat"></span></button></div><div class="seek-row"><span id="elapsed">0:00</span><input type="range" min="0" max="1000" value="0" id="seek" aria-label="Posición de la canción" /><span id="duration">0:00</span></div></div>
    <div class="player-right"><button class="icon-btn queue-trigger" data-action="queue" title="Cola" aria-label="Ver cola"><span class="ico" data-icon="queue"></span></button><span class="ico volume-icon" data-icon="volume"></span><input id="volume" type="range" min="0" max="100" value="82" aria-label="Volumen" /><button class="icon-btn expand-player" data-action="nowplaying" title="Abrir reproductor" aria-label="Ver reproductor"><span class="ico" data-icon="expand"></span></button></div>
  </div>

  <nav class="bottom-nav" aria-label="Navegación principal"><button class="tab active" data-view="home"><span class="ico" data-icon="home"></span><span>Inicio</span></button><button class="tab" data-view="search"><span class="ico" data-icon="search"></span><span>Buscar</span></button><button class="tab" data-view="library"><span class="ico" data-icon="library"></span><span>Mi música</span></button></nav>
  <div id="modal-root"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><audio id="audio" preload="metadata"></audio>
  <script src="./app.js" defer></script>
</body>
</html>
