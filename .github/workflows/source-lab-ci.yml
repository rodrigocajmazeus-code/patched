name: PATCHED - Laboratorio S/0 (sin desplegar)
on:
  push:
    branches:
      - lab/patch-reproduccion-gratis-20261029
  pull_request:
    paths:
      - 'src/player/freeSourceLab.js'
      - 'src/pages/FreeSourceLabPage.jsx'
      - 'src/App.jsx'
      - 'tests/freeSourceLab.test.js'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
